  names:
    kind: Zone
    listKind: ZoneList
    plural: zones
    singular: zone
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Zone is the Schema for the zones API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object. Servers should convert recognized schemas to the latest
              internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents. Servers may infer this from the endpoint the client
              submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
            type: string
          metadata:
            type: object
          spec:
            description: ZoneSpec defines the desired state of Zone
            properties:
              colors:
                items:
                  type: string
                type: array
              devices:
                items:
                  type: string
                type: array
            type: object
          status:
            description: ZoneStatus defines the observed state of Zone
            properties:
              brightness:
                type: string
              color:
                type: string
              color_temperature:
                type: string
              last_reconciled_at:
                description: LastReconciledAt is the wall-clock time of the most recent
                  ReconcileZone call that completed (with or without a flush). Lets
                  operators distinguish "stack is genuinely empty" from "reconciler
                  hasn't ticked recently."
                format: date-time
                type: string
              reconciler_stack:
                description: "ReconcilerStack reflects the per-axis Active Computer
                  Stack for reconcile-managed zones. Written by the conditioner's
                  reconciler after each ReconcileZone; empty/absent for zones not
                  in `-conditioner.reconcile-zones`. Co-exists with the State / Brightness
                  / Color / ColorTemperature fields (written by the zonekeeper) via
                  Status().Patch with disjoint field ownership. \n Short-term: this
                  is how operators inspect \"why is foyer asserting dusk-full right
                  now?\" via `kubectl get zone foyer -o yaml`. Long term, the same
                  data will live on a dedicated ZonePolicy CRD with its own status
                  sub-resource."
                items:
                  description: ReconcilerStackEntry is one axis's view of the Active
                    Computer Stack for a reconcile-managed zone. One entry per axis
                    that has at least one Activation pushed; axes with no pushes are
                    absent from the list.
                  properties:
                    axis:
                      description: Axis is the canonical AxisKind enum string (e.g.
                        AXIS_KIND_BRIGHTNESS). Stable string form so operators can
                        grep without proto knowledge.
                      type: string
                    depth:
                      description: Depth is the count of non-expired Activations on
                        this axis at reconcile time. Always >= 1 (axes with no pushes
                        are absent).
                      format: int32
                      type: integer
                    top:
                      description: Top is the highest-priority non-expired Activation
                        — what's currently winning on this axis. nil only in the transient
                        case where Depth was just bumped to 0 by lazy expiration;
                        in steady state Depth >= 1 implies Top != nil.
                      properties:
                        computer:
                          type: string
                        expires_at:
                          format: date-time
                          type: string
                        priority:
                          format: int32
                          type: integer
                        pushed_at:
                          format: date-time
                          type: string
                        source_kind:
                          type: string
                        source_name:
                          type: string
                      required:
                      - computer
                      - priority
                      - pushed_at
                      - source_kind
                      type: object
                  required:
                  - axis
                  - depth
                  type: object
                type: array
              state:
                type: string
              timeout_after:
                type: string
              timeout_state:
                type: string
            type: object
